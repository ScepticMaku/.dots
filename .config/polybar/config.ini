[colors]

; Colorful Theme
; background = #482862
; background-alt = #F66781
; foreground-alt = #482862
; foreground = #FFFFFF
; primary = #F0C674
; secondary = #8ABEB7
; alert = #A54242
; disabled = #707880

; Personal Theme
bg-main = #0c091c
bg-primary = #1d1f4f
bg-secondary = #283c92
fg-primary = #e7e7e7
fg-secondary = #e3c7fd
alert = #A54242
disabled = #707880

[bar/example]
width = 100%
height = 22pt 
# radius = 6
bottom = true

; dpi = 96

background = ${colors.bg-main}
foreground = ${colors.fg-primary}

# line-size = 3pt

border-size = 8pt
border-color = ${colors.bg-main}

# padding-left = 0
# padding-right = 1
padding = 1

module-margin = 0

# separator = |
# separator-foreground = ${colors.disabled}

# font-0 = monospace;2
font-0 = DepartureMono Nerd Font:size=14;4
font-1 = Font Awesome 6 Free Solid:style=Solid;2
# font-2 = DepartureMono Nerd Font:size=18;4
font-2 = monospace;2

modules-left = xworkspaces xkeyboard i3 owner systray
modules-center = date
modules-right = pulseaudio battery wlan system-bluetooth-bluetoothctl

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

; wm-restack = generic
; wm-restack = bspwm
; wm-restack = i3

; override-redirect = true

[module/systray]
type = internal/tray
padding = 2
tray-spacing = 8pt

[module/owner]
type = custom/text

format = <label>
format-foreground = ${colors.fg-primary}
format-padding = 2

label = markj laptop

[module/xworkspaces]
type = internal/xworkspaces

format-active = <label-active>
label-active = %name%
label-active-background = ${colors.bg-secondary}
label-active-foreground = ${colors.foreground}
label-active-padding = 1

label-occupied = %name%
label-occupied-padding = 1

label-urgent = %name%
label-urgent-background = ${colors.alert}
label-urgent-padding = 1

format-empty = <label-empty>
label-empty = %name%
label-empty-foreground = ${colors.disabled}
label-empty-padding = 1

[module/i3]
type = internal/i3

format = <label-mode>

label-mode = %mode%
label-mode-padding = 1
label-mode-background = ${colors.bg-secondary}
label-mode-foreground = ${colors.fg-primary}

# [module/xwindow]
# type = internal/xwindow
# label = %title:0:60:...%

# [module/filesystem]
# type = internal/fs
# interval = 25

# mount-0 = /

# label-mounted = %{F#F0C674}%mountpoint%%{F-} %percentage_used%%

# label-unmounted = %mountpoint% not mounted
# label-unmounted-foreground = ${colors.disabled}

[module/pulseaudio]
type = internal/pulseaudio

# format-volume-prefix = "VOL "
# format-volume-prefix-foreground = ${colors.primary}
format-volume = <ramp-volume><label-volume>

label-volume = %percentage%%
label-volume-foreground = ${colors.fg-primary}
label-volume-background = ${colors.bg-primary}
label-volume-padding-right = 1

ramp-volume-0 = 
ramp-volume-1 = 
ramp-volume-2 = 
ramp-volume-background = ${colors.bg-primary}
ramp-volume-foreground = ${colors.fg-primary}
ramp-volume-padding-left = 1
ramp-volume-padding-right = 1

label-muted =  muted
label-muted-foreground = ${colors.fg-primary}
label-muted-background = ${colors.bg-primary}
label-muted-padding = 1

[module/xkeyboard]
type = internal/xkeyboard
blacklist-0 = num lock

format = <label-layout><label-indicator>

label-layout =  %layout% 
label-layout-background = ${colors.bg-primary}
label-layout-foreground = ${colors.fg-primary}
label-layout-padding = 1

label-indicator = %name%
label-indicator-padding = 1
label-indicator-foreground = ${colors.fg-primary}
label-indicator-background = ${colors.bg-secondary}

[module/battery]
type = internal/battery

; This is useful in case the battery never reports 100% charge
; Default: 100
full-at = 100

; format-low once this charge percentage is reached
; Default: 10
; New in version 3.6.0
low-at = 5

; Use the following command to list batteries and adapters:
; $ ls -1 /sys/class/power_supply/
battery = BAT1
adapter = ACAD
format-charging = <label-charging>
label-charging =  %percentage%%
format-discharging = <ramp-capacity><label-discharging>
label-discharging = %percentage%%
format-full = <label-full>
label-full =  Full
; If an inotify event haven't been reported in this many
; seconds, manually poll for new values.
;
;
; Needed as a fallback for systems that don't report events
; on sysfs/procfs.
;
; Disable polling by setting the interval to 0.
;
; Default: 5
poll-interval = 5
label-charging-background = ${colors.bg-primary}
label-charging-foreground = ${colors.fg-primary}
label-charging-padding = 1
label-discharging-background = ${colors.bg-primary}
label-discharging-foreground = ${colors.fg-primary}
label-discharging-padding = 1
label-full-background = ${colors.bg-primary}
label-full-foreground = ${colors.fg-primary}
label-full-padding = 1

ramp-capacity-0 =  
ramp-capacity-1 =  
ramp-capacity-2 =  
ramp-capacity-3 =  
ramp-capacity-4 =  
ramp-capacity-background = ${colors.bg-primary}
ramp-capacity-foreground = ${colors.fg-primary}
ramp-capacity-padding = 1

# [module/memory]
# type = internal/memory
# interval = 2
# format-prefix = "RAM "
# format-prefix-foreground = ${colors.primary}
# label = %percentage_used:2%%

# [module/cpu]
# type = internal/cpu
# interval = 2
# format-prefix = "CPU "
# format-prefix-foreground = ${colors.primary}
# label = %percentage:2%%

[network-base]
type = internal/network
interval = 5
format-connected = <label-connected>
label-connected-background = ${colors.bg-primary}
label-connected-foreground = ${colors.fg-primary}
label-connected-padding = 1
format-disconnected = <label-disconnected>
label-disconnected = 󰶐 disconnected
label-disconnected-background = ${colors.bg-primary}
label-disconnected-foreground = ${colors.fg-primary}
label-disconnected-padding = 1

[module/wlan]
inherit = network-base
interface-type = wireless
label-connected =  connected
label-connected-background = ${colors.bg-primary}
label-connected-foreground = ${colors.fg-primary}
label-connected-padding-left = 1
label-connected-padding-right = 1

# [module/eth]
# inherit = network-base
# interface-type = wired
# label-connected = %ifname%% %local_ip%
# label-connected-background = ${colors.background}
# label-connected-foreground = ${colors.foreground}
# label-connected-padding = 1

[module/date]
type = internal/date
interval = 1

date = %H:%M - %d %b %y, %a
date-alt = %Y-%m-%d %H:%M:%S

label =  %date%

format = <label>
format-padding = 0

label-background = ${colors.bg-primary}
label-foreground = ${colors.fg-primary}
label-padding = 1

[module/system-bluetooth-bluetoothctl]
type = custom/script
exec = ~/.config/polybar/system-bluetooth-bluetoothctl.sh
tail = true
click-left = ~/.config/polybar/system-bluetooth-bluetoothctl.sh --toggle &

label-background = ${colors.bg-primary}
label-padding = 1

[settings]
screenchange-reload = true
pseudo-transparency = true

; vim:ft=dosini
